[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "early-attrition-analytics"
version = "1.0.0"
description = "Censoring-aware early-attrition analytics with bilingual (EN/FA) HTML reports and a synthetic demo cohort."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Milad Shabani" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "statsmodels>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
early-attrition = "attrition.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
